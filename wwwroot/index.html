<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>FixIt </title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        input, button, textarea {
            margin: 5px 0;
            padding: 8px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 150px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }

            button:hover {
                background: #45a049;
            }

        pre {
            background: #eee;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>FixIt Requests</h1>

    <h3>Yeni Request Oluştur</h3>
    <textarea id="desc" placeholder="Açıklama gir..."></textarea><br>
    <input id="customer" placeholder="Müşteri Adı" /><br>
    <button onclick="createRequest()">Oluştur</button>

    <h3>Tüm Requestleri Listele</h3>
    <button onclick="getRequests()">Listele</button>
    <pre id="list"></pre>

    <h3>Request Kabul Et</h3>
    <input id="reqId" placeholder="Request ID gir" type="number" /><br>
    <button onclick="acceptRequest()">Kabul Et</button>

    <script>
    const apiUrl = "https://localhost:7072/api/Requests";

    async function createRequest() {
      const desc = document.getElementById("desc").value;
      const customer = document.getElementById("customer").value;
      const body = { description: desc, customerName: customer, status: 0 };

      const res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      alert("Request oluşturuldu: " + JSON.stringify(data));
    }

    async function getRequests() {
      const res = await fetch(apiUrl);
      const data = await res.json();
      document.getElementById("list").textContent = JSON.stringify(data, null, 2);
    }

    async function acceptRequest() {
      const id = document.getElementById("reqId").value;
      const res = await fetch(`${apiUrl}/${id}/accept`, { method: "POST" });
      const data = await res.json();
      alert("Kabul edildi: " + JSON.stringify(data));
    }
    </script>
</body>
</html>
